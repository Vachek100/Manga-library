{% extends "library/base.html" %}

{% block content %}
<div class="confirmation-form">
    <h2>Borrow {{ manga.title }}</h2>
    <form method="post">
        {% csrf_token %}
        <p>Are you sure you want to borrow this manga?</p>
        <button type="submit" class="btn borrow">Confirm Borrow</button>
        <a href="{% url 'manga_detail' manga.pk %}" class="btn cancel">Cancel</a>
    </form>
</div>
{% endblock %}
